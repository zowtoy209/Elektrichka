<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Билет</title>
<style>
    :root {
        --bg-app: #f2f2f7;
        --bg-header: #2c2c2e;
        --text-main: #000000;
        --text-muted: #8e8e93;
        --accent: #ffcc00;
        --badge: #ff3b30;
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        background-color: #000; /* Темный фон за пределами приложения */
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    /* Контейнер приложения */
    .app {
        width: 100%;
        max-width: 500px;
        min-height: 100vh;
        background-color: var(--bg-app);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
    }

    /* Шапка (темно-серая) */
    .header {
        background-color: var(--bg-header);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    
    .header .back {
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        width: 30px;
        font-weight: 300;
        padding-bottom: 4px;
    }
    
    .header .title {
        font-size: 17px;
        font-weight: 600;
        flex: 1;
        text-align: center;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-right: 30px; /* Компенсация левого отступа для центрирования */
    }

    .header .title:active {
        opacity: 0.5;
    }

    /* Основной контент билета */
    .content {
        padding: 24px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* Название маршрута */
    .route {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
    }

    .route h1 {
        font-size: 22px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--text-main);
        padding-right: 10px;
    }

    .train-icon {
        width: 40px;
        height: 40px;
        background: #000;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    .train-icon svg {
        width: 20px;
        height: 20px;
        fill: #fff;
    }

    /* Дата */
    .date-block {
        margin-bottom: 20px;
        cursor: pointer;
    }

    .date-main {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .date-sub {
        font-size: 16px;
        color: var(--text-muted);
    }

    /* Контейнер для QR/Штрихкода */
    .code-container {
        width: 100%;
        background: #ffffff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        cursor: pointer;
    }

    canvas {
        width: 100%;
        max-width: 340px;
        height: 140px;
        display: block;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .code-container.flipped canvas {
        transform: rotateY(90deg);
    }

    /* Описание */
    .details {
        font-size: 17px;
        line-height: 1.4;
        color: var(--text-main);
        margin-bottom: auto; /* Прижимает футер к низу */
    }

    .details p {
        margin-bottom: 4px;
    }

    /* Футер (цена и номер) */
    .footer {
        margin-top: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        color: var(--text-main);
    }

    /* Аккордеон */
    .accordion {
        padding: 16px 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 400;
        color: var(--text-main);
        cursor: pointer;
    }

    .accordion svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
    }

    /* Нижнее меню (темно-серое) */
    .bottom-nav {
        background-color: var(--bg-header);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        position: sticky;
        bottom: 0;
        z-index: 10;
    }

    .nav-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 48px;
        height: 48px;
        position: relative;
    }

    .nav-btn svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: #8e8e93;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-btn.active svg {
        stroke: var(--accent);
    }

    .badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background-color: var(--badge);
        color: white;
        font-size: 11px;
        font-weight: 600;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Всплывающая подсказка */
    .hint {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 100;
    }
    .hint.show {
        opacity: 1;
    }

</style>
</head>
<body>

<div class="app">
    <!-- Шапка -->
    <div class="header">
        <div class="back">‹</div>
        <!-- Нажатие на "Билет" генерирует новый код -->
        <div class="title" id="btnUpdateCode">Билет</div>
    </div>

    <div class="hint" id="hint">Нажми на "Билет" чтобы обновить код</div>

    <!-- Основной контент -->
    <div class="content">
        
        <div class="route">
            <h1>Старая Деревня -<br>Сестрорецк</h1>
            <div class="train-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-6H6V6h5v5zm5.5 6c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6h-5V6h5v5z"/></svg>
            </div>
        </div>

        <div class="date-block" onclick="changeDate()">
            <div class="date-main" id="dateMain">Загрузка...</div>
            <div class="date-sub" id="dateSub">...</div>
        </div>

        <div class="code-container" id="codeContainer">
            <canvas id="barcodeCanvas"></canvas>
        </div>

        <div class="details">
            <p>Полный, в одну сторону</p>
            <p>Билет на электричку стандарт (обычный пригородный поезд)</p>
        </div>

        <div class="footer">
            <div>65 ₽</div>
            <div id="ticketNumber">Билет № ...</div>
        </div>

        <div class="accordion">
            <span>Что делать, если билет не работает</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 10h16M8 6v12"/></svg>
            <div class="badge">2</div>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </div>
</div>

<script>
    const LS_DATE_MAIN = 'ticket_date_main';
    const LS_DATE_SUB = 'ticket_date_sub';
    const LS_NUMBER = 'ticket_number';
    const LS_BARCODE = 'ticket_barcode_data';

    const codeContainer = document.getElementById('codeContainer');
    const titleBtn = document.getElementById('btnUpdateCode');

    // --- ЛОГИКА СОХРАНЕНИЯ И ЗАГРУЗКИ ---
    function init() {
        // Номер билета
        let savedNumber = localStorage.getItem(LS_NUMBER);
        if (!savedNumber) {
            savedNumber = 'Билет № ' + Math.floor(Math.random() * 9000000000000 + 1000000000000);
            localStorage.setItem(LS_NUMBER, savedNumber);
        }
        document.getElementById('ticketNumber').textContent = savedNumber;

        // Дата
        let savedDateMain = localStorage.getItem(LS_DATE_MAIN);
        let savedDateSub = localStorage.getItem(LS_DATE_SUB);
        if (!savedDateMain) {
            savedDateMain = "14 ноября";
            savedDateSub = "Действует до 01:00 15 ноября";
            localStorage.setItem(LS_DATE_MAIN, savedDateMain);
            localStorage.setItem(LS_DATE_SUB, savedDateSub);
        }
        document.getElementById('dateMain').textContent = savedDateMain;
        document.getElementById('dateSub').textContent = savedDateSub;

        // Штрихкод
        let savedBarcode = localStorage.getItem(LS_BARCODE);
        if (!savedBarcode) {
            generateAndSaveNewCode();
        } else {
            renderBarcode(JSON.parse(savedBarcode));
        }
    }

    // --- ГЕНЕРАЦИЯ 2D КОДА (КАК НА ФОТО) ---
    function generateAndSaveNewCode() {
        let newData = generateRandomCodeData();
        localStorage.setItem(LS_BARCODE, JSON.stringify(newData));
        renderBarcode(newData);
    }

    function generateRandomCodeData() {
        // Генерируем набор колонок
        let columns = [];
        // В реальном коде их около 15-20
        let numCols = Math.floor(Math.random() * 5) + 15; 
        
        for (let i = 0; i < numCols; i++) {
            let col = {
                w: Math.floor(Math.random() * 8) + 8, // Ширина колонки (8-16px)
                blocks: [] // Черные блоки
            };
            
            let y = 0;
            // Заполняем колонку блоками разной высоты
            while (y < 100) {
                let blockH = Math.floor(Math.random() * 15) + 5; // Высота блока
                let gap = Math.floor(Math.random() * 8); // Белый отступ
                
                col.blocks.push({ y: y, h: blockH });
                y += blockH + gap;
            }
            columns.push(col);
        }
        return columns;
    }

    function renderBarcode(columns) {
        const canvas = document.getElementById('barcodeCanvas');
        const ctx = canvas.getContext('2d');
        
        // Настраиваем четкость (ретина)
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        
        // Если канвас еще не отрисован (0 ширина), ставим дефолт
        const width = rect.width > 0 ? rect.width : 300;
        const height = rect.height > 0 ? rect.height : 140;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        // Белый фон
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#000000';

        // 1. Рисуем сплошные линии по краям
        let leftLineW = 4;
        let rightLineW = 4;
        
        ctx.fillRect(5, 0, leftLineW, height);
        ctx.fillRect(width - 9, 0, rightLineW, height);

        // 2. Рисуем центральную матрицу
        let startX = 15;
        let endX = width - 15;
        let availableW = endX - startX;
        
        // Вычисляем общую ширину сгенерированных колонок
        let totalW = 0;
        columns.forEach(c => totalW += c.w);
        
        // Масштабируем под доступную ширину
        let scaleX = availableW / totalW;
        
        let currentX = startX;
        let yPad = height * 0.05; // Небольшой отступ сверху и снизу
        let usableH = height - (yPad * 2);

        columns.forEach(col => {
            let colW = col.w * scaleX;
            
            // Рисуем черные блоки внутри колонки
            col.blocks.forEach(b => {
                let blockY = yPad + (b.y / 100) * usableH;
                let blockH = (b.h / 100) * usableH;
                
                // Чтобы не вылезало за границы
                if (blockY + blockH > yPad + usableH) {
                    blockH = (yPad + usableH) - blockY;
                }
                
                ctx.fillRect(currentX, blockY, colW, blockH);
            });
            
            currentX += colW;
        });
    }

    // --- СОБЫТИЯ ---

    // 1. Клик по "Билет" - смена кода
    titleBtn.addEventListener('click', () => {
        codeContainer.classList.add('flipped');
        setTimeout(() => {
            generateAndSaveNewCode();
            codeContainer.classList.remove('flipped');
        }, 400); 
    });

    // 2. Клик по коду - просто переворот
    codeContainer.addEventListener('click', () => {
        codeContainer.classList.add('flipped');
        setTimeout(() => {
            codeContainer.classList.remove('flipped');
        }, 400); 
    });

    // 3. Изменение даты
    function changeDate() {
        let currentVal = document.getElementById('dateMain').textContent;
        let newDate = prompt("Введите новую дату:", currentVal);
        
        if (newDate && newDate !== currentVal) {
            document.getElementById('dateMain').textContent = newDate;
            localStorage.setItem(LS_DATE_MAIN, newDate);
            
            // Расчет "Действует до..."
            let parts = newDate.split(' ');
            let subDate = `Действует до 01:00 15 ноября`;
            
            if(parts.length === 2) {
                let day = parseInt(parts[0]);
                if(!isNaN(day)) {
                    subDate = `Действует до 01:00 ${day + 1} ${parts[1]}`;
                }
            }
            
            document.getElementById('dateSub').textContent = subDate;
            localStorage.setItem(LS_DATE_SUB, subDate);
        }
    }

    // Показ подсказки при первом заходе
    setTimeout(() => {
        const hint = document.getElementById('hint');
        if (hint) {
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 3000);
        }
    }, 500);

    // Запуск
    init();

    // Обновление размеров холста при повороте экрана
    window.addEventListener('resize', () => {
        let savedBarcode = localStorage.getItem(LS_BARCODE);
        if(savedBarcode) renderBarcode(JSON.parse(savedBarcode));
    });

</script>
</body>
</html>
