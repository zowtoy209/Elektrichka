<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Билет</title>
<style>
    :root {
        --bg-app: #f2f2f7;
        --bg-header: #2c2c2e;
        --text-main: #000000;
        --text-muted: #8e8e93;
        --accent: #ffcc00;
        --badge: #ff3b30;
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        background-color: #000;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    /* Контейнер приложения */
    .app {
        width: 100%;
        max-width: 500px;
        min-height: 100vh;
        background-color: var(--bg-app);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
    }

    /* Шапка (темно-серая) */
    .header {
        background-color: var(--bg-header);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    
    .header .back {
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        width: 30px;
        font-weight: 300;
        padding-bottom: 4px;
    }
    
    .header .title {
        font-size: 17px;
        font-weight: 600;
        flex: 1;
        text-align: center;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-right: 30px;
    }

    .header .title:active {
        opacity: 0.5;
    }

    /* Основной контент билета */
    .content {
        padding: 24px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* Название маршрута */
    .route {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
    }

    .route h1 {
        font-size: 22px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--text-main);
        padding-right: 10px;
    }

    .train-icon {
        width: 40px;
        height: 40px;
        background: #000;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    .train-icon svg {
        width: 20px;
        height: 20px;
        fill: #fff;
    }

    /* Дата */
    .date-block {
        margin-bottom: 20px;
        cursor: pointer;
    }

    .date-main {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .date-sub {
        font-size: 16px;
        color: var(--text-muted);
    }

    /* Контейнер для кода */
    .code-container {
        width: 100%;
        background: #ffffff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        cursor: pointer;
        transform-style: preserve-3d;
    }

    #qrCode {
        width: 100%;
        max-width: 360px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        perspective: 900px;
    }

    #qrCode canvas {
        transform-style: preserve-3d;
        backface-visibility: visible;
        width: 100% !important;
        height: 140px !important;
        display: block;
        image-rendering: pixelated;
    }

    /* Горизонтальное вращение кода */
    @keyframes spinHorizontal {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(360deg); }
    }

    .code-container.spinning canvas {
        animation: spinHorizontal 0.6s ease-in-out;
    }

    /* Описание */
    .details {
        font-size: 17px;
        line-height: 1.4;
        color: var(--text-main);
        margin-bottom: auto;
    }

    .details p {
        margin-bottom: 4px;
    }

    /* Футер (цена и номер) */
    .footer {
        margin-top: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        color: var(--text-main);
    }

    /* Аккордеон */
    .accordion {
        padding: 16px 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 400;
        color: var(--text-main);
        cursor: pointer;
    }

    .accordion svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
    }

    /* Нижнее меню (темно-серое) */
    .bottom-nav {
        background-color: var(--bg-header);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        position: sticky;
        bottom: 0;
        z-index: 10;
    }

    .nav-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 48px;
        height: 48px;
        position: relative;
    }

    .nav-btn svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: #8e8e93;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-btn.active svg {
        stroke: var(--accent);
    }

    .badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background-color: var(--badge);
        color: white;
        font-size: 11px;
        font-weight: 600;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

</style>
</head>
<body>

<div class="app">
    <!-- Шапка -->
    <div class="header">
        <div class="back">‹</div>
        <!-- Нажатие на "Билет" генерирует новый код -->
        <div class="title" id="btnUpdateCode">Билет</div>
    </div>

    <!-- Основной контент -->
    <div class="content">
        
        <div class="route">
            <h1>Старая Деревня -<br>Сестрорецк</h1>
            <div class="train-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-6H6V6h5v5zm5.5 6c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6h-5V6h5v5z"/></svg>
            </div>
        </div>

        <div class="date-block" onclick="changeDate()">
            <div class="date-main" id="dateMain">Загрузка...</div>
            <div class="date-sub" id="dateSub">...</div>
        </div>

        <div class="code-container" id="codeContainer">
            <div id="qrCode" aria-label="Билетный код"></div>
        </div>

        <div class="details">
            <p>Полный, в одну сторону</p>
            <p>Билет на электричку стандарт (обычный пригородный поезд)</p>
        </div>

        <div class="footer">
            <div>65 ₽</div>
            <div id="ticketNumber">Билет № ...</div>
        </div>

        <div class="accordion">
            <span>Что делать, если билет не работает</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 10h16M8 6v12"/></svg>
            <div class="badge">2</div>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </div>
</div>

<script>
    const LS_DATE_MAIN = 'ticket_date_main_v2';
    const LS_DATE_SUB = 'ticket_date_sub_v2';
    const LS_NUMBER = 'ticket_number_v2';
    const LS_QR_TOKEN = 'ticket_qr_token_v2';

    const codeContainer = document.getElementById('codeContainer');
    const titleBtn = document.getElementById('btnUpdateCode');
    let isSpinning = false;

    // Декоративный код в вытянутом формате, похожем по композиции
    // на билетный 2D-код.
    function randomToken() {
        const bytes = new Uint8Array(16);
        if (window.crypto && crypto.getRandomValues) {
            crypto.getRandomValues(bytes);
        } else {
            for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
        }
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function renderQR(token) {
        const target = document.getElementById('qrCode');
        target.innerHTML = '';
        const canvas = document.createElement('canvas');
        const width = 360, height = 140, dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = '100%';
        canvas.style.height = '140px';
        target.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#111';

        // Боковые направляющие.
        ctx.fillRect(5, 4, 11, 132);
        [24, 30, 37].forEach(x => ctx.fillRect(x, 4, 2, 132));
        ctx.fillRect(344, 4, 11, 132);
        [323, 330, 336].forEach(x => ctx.fillRect(x, 4, 2, 132));

        // Прямоугольная матрица.
        let seed = 2166136261;
        for (const ch of token) {
            seed ^= ch.charCodeAt(0);
            seed = Math.imul(seed, 16777619);
        }
        function rand() {
            seed += 0x6D2B79F5;
            let t = seed;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }

        const x0 = 48, y0 = 5, cols = 88, rows = 34;
        const cellW = 3.0, cellH = 3.82;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const density = (c % 17 === 0) ? 0.36 : 0.53;
                if (rand() < density) {
                    ctx.fillRect(
                        x0 + c * cellW,
                        y0 + r * cellH,
                        Math.ceil(cellW * (rand() < 0.14 ? 1.5 : 1)),
                        Math.ceil(cellH * (rand() < 0.18 ? 1.5 : 1))
                    );
                }
            }
        }

        // Узкие вертикальные разделители между секциями.
        [101, 154, 207, 260].forEach(x => ctx.fillRect(x, 3, 2, 134));
    }

    function generateAndSaveNewCode() {
        const token = randomToken();
        localStorage.setItem(LS_QR_TOKEN, token);
        renderQR(token);
        const number = 'Билет № ' + token.slice(0, 10);
        localStorage.setItem(LS_NUMBER, number);
        document.getElementById('ticketNumber').textContent = number;
    }

    function init() {
        let savedNumber = localStorage.getItem(LS_NUMBER);
        if (!savedNumber) {
            savedNumber = 'Билет № ' + randomToken().slice(0, 10);
            localStorage.setItem(LS_NUMBER, savedNumber);
        }
        document.getElementById('ticketNumber').textContent = savedNumber;

        let savedDateMain = localStorage.getItem(LS_DATE_MAIN);
        let savedDateSub = localStorage.getItem(LS_DATE_SUB);
        if (!savedDateMain) {
            const now = new Date();
            savedDateMain = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            savedDateSub = 'Действует до 01:00 ' + tomorrow.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            localStorage.setItem(LS_DATE_MAIN, savedDateMain);
            localStorage.setItem(LS_DATE_SUB, savedDateSub);
        }
        document.getElementById('dateMain').textContent = savedDateMain;
        document.getElementById('dateSub').textContent = savedDateSub;

        const savedToken = localStorage.getItem(LS_QR_TOKEN);
        if (savedToken) renderQR(savedToken);
        else generateAndSaveNewCode();
    }

    // --- Горизонтальное вращение кода ---
    function spinCode() {
        if (isSpinning) return;
        isSpinning = true;
        codeContainer.classList.add('spinning');
        codeContainer.addEventListener('animationend', () => {
            codeContainer.classList.remove('spinning');
            isSpinning = false;
        }, { once: true });
    }

    // --- СОБЫТИЯ ---

    // Нажатие на заголовок: вращение + новый код.
    titleBtn.addEventListener('click', () => {
        spinCode();
        setTimeout(generateAndSaveNewCode, 300);
    });

    // Нажатие непосредственно на код запускает горизонтальное вращение.
    document.getElementById('qrCode').addEventListener('click', () => {
        spinCode();
    });

    // 3. Изменение даты
    function changeDate() {
        let currentVal = document.getElementById('dateMain').textContent;
        let newDate = prompt("Введите новую дату:", currentVal);
        
        if (newDate && newDate !== currentVal) {
            document.getElementById('dateMain').textContent = newDate;
            localStorage.setItem(LS_DATE_MAIN, newDate);
            
            // Расчет "Действует до..."
            let parts = newDate.split(' ');
            let subDate = `Действует до 01:00 15 ноября`;
            
            if (parts.length === 2) {
                let day = parseInt(parts[0]);
                if (!isNaN(day)) {
                    subDate = `Действует до 01:00 ${day + 1} ${parts[1]}`;
                }
            }
            
            document.getElementById('dateSub').textContent = subDate;
            localStorage.setItem(LS_DATE_SUB, subDate);
        }
    }

    // Запуск
    init();
</script>
</body>
</html>
