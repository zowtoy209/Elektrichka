<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Билет</title>
<style>
    :root {
        --bg-app: #f2f2f7;
        --bg-header: #2c2c2e;
        --text-main: #000000;
        --text-muted: #8e8e93;
        --accent: #ffcc00;
        --badge: #ff3b30;
    }
    
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        background-color: #000;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .app {
        width: 100%;
        max-width: 500px;
        min-height: 100vh;
        background-color: var(--bg-app);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
    }

    .header {
        background-color: var(--bg-header);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    
    .header .back {
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        width: 30px;
        font-weight: 300;
        padding-bottom: 4px;
    }
    
    .header .title {
        font-size: 17px;
        font-weight: 600;
        flex: 1;
        text-align: center;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-right: 30px;
    }

    .header .title:active {
        opacity: 0.5;
    }

    .content {
        padding: 24px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .route {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
    }

    .route h1 {
        font-size: 21px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--text-main);
        padding-right: 10px;
    }

    .train-icon {
        width: 36px;
        height: 36px;
        background: #000;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        margin-top: 2px;
    }

    .train-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
    }

    .date-block {
        margin-bottom: 24px;
        cursor: pointer;
    }

    .date-main {
        font-size: 22px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 2px;
    }

    .date-sub {
        font-size: 16px;
        color: var(--text-muted);
    }

    /* Контейнер для кода (подогнан под пропорции 2D-кода) */
    .code-container {
        width: 100%;
        background: #ffffff;
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        cursor: pointer;
        height: 150px; /* Увеличенная высота для солидности */
        border: 1px solid #e5e5ea;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .code-container.flipped canvas {
        transform: rotateY(90deg);
    }

    .details {
        font-size: 16px;
        line-height: 1.4;
        color: var(--text-main);
        margin-bottom: auto;
    }

    .details p {
        margin-bottom: 4px;
    }

    .footer {
        margin-top: 30px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        color: var(--text-main);
    }

    .accordion {
        padding: 16px 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 400;
        color: var(--text-main);
        cursor: pointer;
    }

    .accordion svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
    }

    .bottom-nav {
        background-color: var(--bg-header);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        position: sticky;
        bottom: 0;
        z-index: 10;
    }

    .nav-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 48px;
        height: 48px;
        position: relative;
    }

    .nav-btn svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #8e8e93;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-btn.active svg {
        stroke: var(--accent);
    }

    .badge {
        position: absolute;
        top: 6px;
        right: 4px;
        background-color: var(--badge);
        color: white;
        font-size: 11px;
        font-weight: 600;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .hint {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 100;
    }
    .hint.show {
        opacity: 1;
    }

</style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="back">‹</div>
        <div class="title" id="btnUpdateCode">Билет</div>
    </div>

    <div class="hint" id="hint">Нажми на "Билет" чтобы обновить</div>

    <div class="content">
        
        <div class="route">
            <h1>Старая Деревня - Сестрорецк</h1>
            <div class="train-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm3.5-6H6V6h5v5zm5.5 6c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6h-5V6h5v5z"/></svg>
            </div>
        </div>

        <div class="date-block" onclick="changeDate()">
            <div class="date-main" id="dateMain">Загрузка...</div>
            <div class="date-sub" id="dateSub">...</div>
        </div>

        <!-- Блок кода -->
        <div class="code-container" id="codeContainer">
            <canvas id="barcodeCanvas"></canvas>
        </div>

        <div class="details">
            <p>Полный, в одну сторону</p>
            <p>Билет на электричку стандарт (обычный пригородный поезд)</p>
        </div>

        <div class="footer">
            <div>65 ₽</div>
            <div id="ticketNumber">Билет № ...</div>
        </div>

        <div class="accordion">
            <span>Что делать, если билет не работает</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 10h16M8 6v12"/></svg>
            <div class="badge">2</div>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </div>
</div>

<script>
    const LS_DATE_MAIN = 'ticket_date_main';
    const LS_DATE_SUB = 'ticket_date_sub';
    const LS_NUMBER = 'ticket_number';
    const LS_MATRIX = 'ticket_matrix_data';
    
    const codeContainer = document.getElementById('codeContainer');
    const titleBtn = document.getElementById('btnUpdateCode');

    // --- ГЕНЕРАЦИЯ МАТРИЦЫ ---
    function generateMatrix() {
        // Матрица 6 колонок на 25 строк (пикселей в высоту)
        let matrix = [];
        for(let c = 0; c < 6; c++) {
            let col = [];
            for(let r = 0; r < 25; r++) {
                // 45% шанс, что пиксель будет черным
                col.push(Math.random() < 0.45 ? 1 : 0); 
            }
            matrix.push(col);
        }
        return matrix;
    }

    // --- ОТРИСОВКА (КАК НА ФОТО) ---
    function renderCode(matrix) {
        const canvas = document.getElementById('barcodeCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ретина-дисплей (четкость)
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || 300;
        const height = rect.height || 150;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        // Белый фон
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#000000';

        // Вычисляем отступы и размеры зон
        let leftGuardW = width * 0.08; // 8% ширины на левую рамку
        let rightGuardW = width * 0.08; // 8% ширины на правую рамку
        let middleX = leftGuardW + 10;
        let middleW = width - rightGuardW - middleX - 10;
        
        let yPad = 10; // Отступ сверху/снизу
        let drawH = height - yPad * 2;

        // 1. ЛЕВАЯ РАМКА (Толстая полоса + 2 тонкие)
        ctx.fillRect(5, 0, leftGuardW, height); // Толстая
        ctx.fillRect(leftGuardW + 8, 0, 2, height); // Тонкая
        ctx.fillRect(leftGuardW + 15, 0, 2, height); // Тонкая

        // 2. ПРАВАЯ РАМКА (Толстая полоса + 2 тонкие)
        let rightStart = width - rightGuardW - 5;
        ctx.fillRect(rightStart, 0, leftGuardW, height); // Толстая
        ctx.fillRect(rightStart - 8, 0, 2, height); // Тонкая
        ctx.fillRect(rightStart - 15, 0, 2, height); // Тонкая

        // 3. ЦЕНТРАЛЬНАЯ МАТРИЦА (6 колонок)
        let numCols = matrix.length;
        let colSpacing = middleW / numCols;
        let blockSize = 3; // Размер одного "пикселя"

        for (let c = 0; c < numCols; c++) {
            let colX = middleX + (c * colSpacing);
            
            // Сплошная линия слева от каждой колонки (как на фото)
            ctx.fillRect(colX, yPad, 2, drawH);

            // Рисуем пиксели внутри колонки
            let col = matrix[c];
            let numRows = col.length;
            let rowSpacing = drawH / numRows;

            for (let r = 0; r < numRows; r++) {
                if (col[r] === 1) {
                    let blockY = yPad + (r * rowSpacing);
                    // Рисуем прямоугольник, чуть меньше ячейки, чтобы был зазор
                    ctx.fillRect(colX + 4, blockY, colSpacing - 6, rowSpacing - 1);
                }
            }
        }
    }

    // --- ЛОГИКА ---
    function init() {
        // Номер
        let savedNumber = localStorage.getItem(LS_NUMBER);
        if (!savedNumber) {
            savedNumber = 'Билет № ' + Math.floor(Math.random() * 9000000000000 + 1000000000000);
            localStorage.setItem(LS_NUMBER, savedNumber);
        }
        document.getElementById('ticketNumber').textContent = savedNumber;

        // Дата
        let savedDateMain = localStorage.getItem(LS_DATE_MAIN);
        let savedDateSub = localStorage.getItem(LS_DATE_SUB);
        if (!savedDateMain) {
            savedDateMain = "14 ноября";
            savedDateSub = "Действует до 01:00 15 ноября";
            localStorage.setItem(LS_DATE_MAIN, savedDateMain);
            localStorage.setItem(LS_DATE_SUB, savedDateSub);
        }
        document.getElementById('dateMain').textContent = savedDateMain;
        document.getElementById('dateSub').textContent = savedDateSub;

        // Код
        let savedMatrix = localStorage.getItem(LS_MATRIX);
        if (!savedMatrix) {
            let newMatrix = generateMatrix();
            localStorage.setItem(LS_MATRIX, JSON.stringify(newMatrix));
            renderCode(newMatrix);
        } else {
            renderCode(JSON.parse(savedMatrix));
        }
    }

    // --- СОБЫТИЯ ---
    
    // Клик на "Билет" (Смена кода)
    titleBtn.addEventListener('click', () => {
        codeContainer.classList.add('flipped');
        setTimeout(() => {
            // Меняем номер
            let newNumber = 'Билет № ' + Math.floor(Math.random() * 9000000000000 + 1000000000000);
            localStorage.setItem(LS_NUMBER, newNumber);
            document.getElementById('ticketNumber').textContent = newNumber;
            
            // Меняем матрицу
            let newMatrix = generateMatrix();
            localStorage.setItem(LS_MATRIX, JSON.stringify(newMatrix));
            renderCode(newMatrix);
            
            codeContainer.classList.remove('flipped');
        }, 400); 
    });

    // Клик на сам код (Анимация)
    codeContainer.addEventListener('click', () => {
        codeContainer.classList.add('flipped');
        setTimeout(() => {
            codeContainer.classList.remove('flipped');
        }, 400); 
    });

    // Смена даты
    function changeDate() {
        let currentVal = document.getElementById('dateMain').textContent;
        let newDate = prompt("Введите новую дату:", currentVal);
        
        if (newDate && newDate !== currentVal) {
            document.getElementById('dateMain').textContent = newDate;
            localStorage.setItem(LS_DATE_MAIN, newDate);
            
            let parts = newDate.split(' ');
            let subDate = `Действует до 01:00 15 ноября`;
            
            if(parts.length === 2) {
                let day = parseInt(parts[0]);
                if(!isNaN(day)) {
                    subDate = `Действует до 01:00 ${day + 1} ${parts[1]}`;
                }
            }
            
            document.getElementById('dateSub').textContent = subDate;
            localStorage.setItem(LS_DATE_SUB, subDate);
        }
    }

    // Подсказка
    setTimeout(() => {
        const hint = document.getElementById('hint');
        if (hint) {
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 3000);
        }
    }, 500);

    // Запуск
    init();

    window.addEventListener('resize', () => {
        let savedMatrix = localStorage.getItem(LS_MATRIX);
        if(savedMatrix) renderCode(JSON.parse(savedMatrix));
    });
</script>
</body>
</html>
